apiVersion: lubanlock/v1alpha1
kind: Tool
metadata:
  name: web_search
  description: Search the public web and return candidate results with titles and URLs.
  tags:
    - web
spec:
  input_schema:
    type: object
    additionalProperties: false
    required:
      - query
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 400
      limit:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
  output_schema:
    type: object
    required:
      - results
    properties:
      results:
        type: array
        items:
          type: object
          required:
            - title
            - url
          properties:
            title:
              type: string
            url:
              type: string
            snippet:
              type: string
  annotations:
    read_only: true
    idempotent: true
    open_world: true
  source:
    kind: builtin
    ref: web_search

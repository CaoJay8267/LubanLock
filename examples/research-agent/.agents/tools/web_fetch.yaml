apiVersion: dotagent/v1alpha1
kind: Tool
metadata:
  name: web_fetch
  description: Fetch a URL and return its readable text content.
  tags:
    - web
spec:
  input_schema:
    type: object
    additionalProperties: false
    required:
      - url
    properties:
      url:
        type: string
        pattern: "^https?://"
        maxLength: 2048
  output_schema:
    type: object
    required:
      - text
    properties:
      text:
        type: string
      content_type:
        type: string
  annotations:
    read_only: true
    idempotent: true
    open_world: true
  source:
    kind: builtin
    ref: web_fetch

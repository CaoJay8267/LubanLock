apiVersion: lubanlock/v1alpha1
kind: Task
metadata:
  name: plan-research
  description: Decompose a research question into searchable sub-questions.
  tags:
    - planning
spec:
  prompt:
    file: prompts/plan-research.md
  input_schema:
    type: object
    additionalProperties: false
    required:
      - question
    properties:
      question:
        type: string
        minLength: 1
        maxLength: 2000
  output_schema:
    type: object
    required:
      - subquestions
    properties:
      subquestions:
        type: array
        minItems: 1
        items:
          type: string
  skills:
    - web-research
  examples:
    - input:
        question: Does the project support Windows?
      output:
        subquestions:
          - Which Windows versions are documented?
          - Are there platform-specific limitations?

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lubanlock"
version = "1.0.0"
description = "Luban Lock: declarative, portable agent definitions built from AGENTS.md + .agents/"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CaoJay8267" }]
keywords = ["agent", "lubanlock", "declarative", "portable", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
signing = ["cryptography>=42"]
mcp = ["websockets>=12"]
timestamp = ["rfc3161ng>=2.1"]
dev = [
    "coverage[toml]>=7.5",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "websockets>=12",
    "rfc3161ng>=2.1",
]

[project.scripts]
lubanlock = "lubanlock.cli:main"

[project.entry-points."lubanlock.projectors"]
# Third-party projectors register here, e.g.
# myprojector = "my_package:MyProjector"

[project.entry-points."lubanlock.runtime_adapters"]
# Third-party runtime adapters register here.

[project.entry-points."lubanlock.audit_rules"]
# Third-party audit rules register here, e.g.
# myrule = "my_package:MyRule"

[tool.setuptools]
packages = [
    "lubanlock",
    "lubanlock.core",
    "lubanlock.spec",
    "lubanlock.spec.schema",
    "lubanlock.build",
    "lubanlock.project",
    "lubanlock.runtime",
    "lubanlock.testkit",
    "lubanlock.audit",
    "lubanlock.integrations",
    "lubanlock.templates",
]

[tool.setuptools.package-data]
lubanlock = ["spec/schema/schemas/*.json", "py.typed"]

[tool.coverage.run]
source = ["lubanlock"]
omit = ["lubanlock/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["lubanlock"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

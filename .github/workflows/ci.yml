name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[signing,dev]"
      - name: Lint
        run: |
          ruff --version
          ruff check dotagent tests scripts --output-format github
      - name: Type check
        run: mypy dotagent
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t tests > test-output.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "### Unit test failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(FAIL|ERROR):' test-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[signing,dev]"
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -t tests
          coverage report

  build:
    name: build wheel and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel . --no-deps -w dist
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test
        run: |
          dotagent --version
          dotagent init smoke --path "$RUNNER_TEMP/smoke"
          dotagent validate "$RUNNER_TEMP/smoke"
          dotagent test "$RUNNER_TEMP/smoke" --suite limits
